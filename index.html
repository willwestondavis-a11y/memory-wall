<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0">

<!-- iPhone / iPad app mode -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memory Wall">

<!-- App icon -->
<link rel="apple-touch-icon" href="icon.png">

<title>Memory Wall</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f4f4f1;
    color: #171717;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(244,244,241,.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(0,0,0,.08);
}

.logo {
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -0.6px;
}

.logo span {
    color: #777;
    font-weight: 500;
}

.headerRight {
    display: flex;
    align-items: center;
    gap: 10px;
}

.photoCount {
    color: #777;
    font-size: 14px;
}

/* =========================
   BUTTONS
========================= */

button {
    font-family: inherit;
}

.addButton {
    border: 0;

    background: #171717;
    color: white;

    padding: 11px 18px;

    border-radius: 11px;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.addButton:hover {
    transform: translateY(-1px);
    background: #303030;
}

.addButton:active {
    transform: scale(.97);
}

/* =========================
   DROP AREA
========================= */

.dropArea {
    width: min(1100px, calc(100% - 32px));

    margin: 30px auto 20px;

    border: 1.5px dashed #b7b7b2;

    border-radius: 18px;

    min-height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(255,255,255,.45);

    transition:
        border-color .2s,
        background .2s,
        transform .2s;
}

.dropArea.dragging {
    border-color: #222;
    background: white;
    transform: scale(1.01);
}

.dropText {
    padding: 25px;
}

.dropTitle {
    font-size: 18px;
    font-weight: 650;
    margin-bottom: 7px;
}

.dropSubtitle {
    color: #888;
    font-size: 14px;
}

/* =========================
   COLLAGE
========================= */

.gallery {
    width: min(1500px, calc(100% - 28px));

    margin: 0 auto;

    padding:
        10px
        0
        100px;

    columns: 5 220px;

    column-gap: 13px;
}

.photoCard {
    position: relative;

    display: inline-block;

    width: 100%;

    margin: 0 0 13px;

    break-inside: avoid;

    overflow: hidden;

    border-radius: 13px;

    background: #ddd;

    cursor: pointer;

    box-shadow:
        0 2px 10px rgba(0,0,0,.06);

    animation:
        appear .35s ease both;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.photoCard img {
    display: block;

    width: 100%;
    height: auto;

    transition:
        transform .35s ease,
        filter .35s ease;
}

.photoCard:hover img {
    transform: scale(1.025);
}

/* =========================
   PHOTO INFO
========================= */

.photoInfo {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 42px 14px 13px;

    color: white;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.72)
        );

    opacity: 0;

    transform:
        translateY(8px);

    transition:
        opacity .2s,
        transform .2s;

    pointer-events: none;
}

.photoCard:hover .photoInfo {
    opacity: 1;
    transform: translateY(0);
}

.photoDate {
    font-size: 14px;
    font-weight: 650;
}

.photoMeta {
    margin-top: 3px;

    font-size: 11px;

    color: rgba(255,255,255,.75);
}

/* =========================
   DELETE BUTTON
========================= */

.deletePhoto {
    position: absolute;

    top: 9px;
    right: 9px;

    width: 31px;
    height: 31px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.62);

    color: white;

    font-size: 17px;

    cursor: pointer;

    opacity: 0;

    transition:
        opacity .2s,
        transform .15s;
}

.photoCard:hover .deletePhoto {
    opacity: 1;
}

.deletePhoto:hover {
    transform: scale(1.08);
    background: #d93030;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
    width: min(700px, calc(100% - 40px));

    margin: 75px auto;

    text-align: center;

    color: #777;
}

.emptyIcon {
    font-size: 48px;
    margin-bottom: 15px;
}

.empty h2 {
    margin: 0 0 8px;

    color: #222;

    font-size: 25px;
}

.empty p {
    margin: 0;

    line-height: 1.6;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.modal.open {
    display: flex;
}

.modalBox {
    width: min(850px, 100%);

    max-height: 92vh;

    overflow: hidden;

    background: #fff;

    border-radius: 20px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.4);

    position: relative;
}

.modalImage {
    display: block;

    width: 100%;

    max-height: 75vh;

    object-fit: contain;

    background: #111;
}

.modalDetails {
    padding: 17px 20px;
}

.modalDate {
    font-size: 18px;
    font-weight: 700;
}

.modalName {
    margin-top: 4px;

    color: #777;

    font-size: 13px;
}

.closeModal {
    position: absolute;

    top: 12px;
    right: 12px;

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 50%;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 2;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    bottom: 24px;
    left: 50%;

    transform:
        translate(-50%, 20px);

    z-index: 1000;

    background: #171717;
    color: white;

    padding: 12px 18px;

    border-radius: 12px;

    font-size: 14px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s,
        transform .25s;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {

    header {
        height: 65px;

        padding:
            0 14px;
    }

    .logo {
        font-size: 18px;
    }

    .photoCount {
        display: none;
    }

    .addButton {
        padding:
            9px 13px;

        font-size: 13px;
    }

    .dropArea {
        width:
            calc(100% - 22px);

        margin-top: 16px;

        min-height: 105px;

        border-radius: 14px;
    }

    .dropTitle {
        font-size: 16px;
    }

    .dropSubtitle {
        font-size: 12px;
    }

    .gallery {
        width:
            calc(100% - 18px);

        columns: 2 140px;

        column-gap: 7px;

        padding-bottom: 80px;
    }

    .photoCard {
        margin-bottom: 7px;
        border-radius: 9px;
    }

    /*
       On phones, hover doesn't exist,
       so info can be shown by tapping
       the photo through the modal.
    */

    .photoInfo {
        display: none;
    }

    .deletePhoto {
        opacity: 1;

        width: 29px;
        height: 29px;

        font-size: 15px;
    }

    .modal {
        padding: 8px;
    }

    .modalBox {
        border-radius: 15px;
    }

    .modalImage {
        max-height: 78vh;
    }

}

/* Very small phones */

@media(max-width: 390px) {

    .gallery {
        columns: 2 120px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        Memory Wall
        <span>∞</span>
    </div>

    <div class="headerRight">

        <div class="photoCount"
             id="photoCount">
            0 photos
        </div>

        <button
            class="addButton"
            id="addButton">

            + Add photos

        </button>

    </div>

</header>


<!-- =========================
     FILE INPUT
========================= -->

<input
    type="file"
    id="fileInput"
    accept="image/*"
    multiple
    hidden
>


<!-- =========================
     DROP AREA
========================= -->

<div
    class="dropArea"
    id="dropArea">

    <div class="dropText">

        <div class="dropTitle">
            Build your memory wall
        </div>

        <div class="dropSubtitle">
            Drop photos here or tap “Add photos”
        </div>

    </div>

</div>


<!-- =========================
     GALLERY
========================= -->

<div
    class="gallery"
    id="gallery">
</div>


<!-- =========================
     EMPTY STATE
========================= -->

<div
    class="empty"
    id="emptyState">

    <div class="emptyIcon">
        🖼️
    </div>

    <h2>
        Your wall is empty
    </h2>

    <p>
        Add your first photos and start building
        your endless collection of memories.
    </p>

</div>


<!-- =========================
     PHOTO MODAL
========================= -->

<div
    class="modal"
    id="modal">

    <div class="modalBox">

        <button
            class="closeModal"
            id="closeModal">

            ×

        </button>

        <img
            class="modalImage"
            id="modalImage"
            alt=""
        >

        <div class="modalDetails">

            <div
                class="modalDate"
                id="modalDate">
            </div>

            <div
                class="modalName"
                id="modalName">
            </div>

        </div>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================================================
   MEMORY WALL

   Uses IndexedDB instead of localStorage.

   This allows MUCH larger collections of photos.
========================================================= */

const DB_NAME =
    "MemoryWallDatabase";

const DB_VERSION = 1;

const STORE_NAME =
    "photos";

let db;


/* =========================================================
   OPEN DATABASE
========================================================= */

function openDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;

                    if(
                        !database.objectStoreNames
                        .contains(STORE_NAME)
                    ){

                        const store =
                            database.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath:"id",
                                    autoIncrement:true
                                }
                            );

                        store.createIndex(
                            "added",
                            "added",
                            {
                                unique:false
                            }
                        );

                    }

                };


            request.onsuccess =
                event => {

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   SAVE PHOTO
========================================================= */

function savePhoto(photo){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.add(photo);

            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };

            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   GET ALL PHOTOS
========================================================= */

function getAllPhotos(){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.getAll();

            request.onsuccess =
                () => {

                    const photos =
                        request.result;

                    /*
                       Newest photos first.
                    */

                    photos.sort(
                        (a,b) =>
                            b.added -
                            a.added
                    );

                    resolve(
                        photos
                    );

                };

            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   DELETE PHOTO
========================================================= */

function deletePhoto(id){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.delete(id);

            request.onsuccess =
                () => resolve();

            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =========================================================
   READ EXIF DATE
=========================================================

   This reads the common JPEG EXIF
   DateTimeOriginal field.

   Example:

   2026:09:25 19:42:12

========================================================= */

async function getPhotoDate(file){

    try {

        if(
            file.type !== "image/jpeg" &&
            file.type !== "image/jpg"
        ){

            /*
               Some browsers expose the
               file's last modified date.

               This is NOT necessarily when
               the photo was taken.
            */

            if(file.lastModified){

                return {
                    date:
                        new Date(
                            file.lastModified
                        ),

                    source:
                        "File date"
                };

            }

            return {
                date:null,
                source:"Unavailable"
            };

        }


        const buffer =
            await file.arrayBuffer();

        const view =
            new DataView(buffer);


        /*
           JPEG starts with FF D8
        */

        if(
            view.getUint16(0) !== 0xFFD8
        ){

            return {
                date:null,
                source:"Unavailable"
            };

        }


        let offset=2;


        while(
            offset <
            view.byteLength
        ){

            if(
                view.getUint8(offset) !==
                0xFF
            ){

                break;

            }


            const marker =
                view.getUint8(
                    offset+1
                );


            /*
               Start of Scan.
            */

            if(marker===0xDA)
                break;


            const length =
                view.getUint16(
                    offset+2
                );


            /*
               APP1 = EXIF
            */

            if(marker===0xE1){

                const exifStart =
                    offset+4;

                const exifHeader =
                    String.fromCharCode(
                        view.getUint8(
                            exifStart
                        ),
                        view.getUint8(
                            exifStart+1
                        ),
                        view.getUint8(
                            exifStart+2
                        ),
                        view.getUint8(
                            exifStart+3
                        )
                    );


                if(
                    exifHeader === "Exif"
                ){

                    const tiff =
                        exifStart+6;

                    return readExifDate(
                        view,
                        tiff
                    );

                }

            }


            offset +=
                2 + length;

        }


    } catch(error){

        console.log(
            "Could not read EXIF:",
            error
        );

    }


    /*
       Fallback.
    */

    if(file.lastModified){

        return {

            date:
                new Date(
                    file.lastModified
                ),

            source:
                "File date"

        };

    }


    return {

        date:null,

        source:
            "Unavailable"

    };

}


/* =========================================================
   EXIF PARSER
========================================================= */

function readExifDate(
    view,
    tiff
){

    try {

        const byteOrder =
            String.fromCharCode(
                view.getUint8(tiff),
                view.getUint8(tiff+1)
            );


        const little =
            byteOrder === "II";


        const get16 =
            offset =>
                view.getUint16(
                    offset,
                    little
                );


        const get32 =
            offset =>
                view.getUint32(
                    offset,
                    little
                );


        const ifdOffset =
            tiff +
            get32(tiff+4);


        const count =
            get16(ifdOffset);


        for(
            let i=0;
            i<count;
            i++
        ){

            const entry =
                ifdOffset +
                2 +
                i*12;


            const tag =
                get16(entry);


            /*
               DateTimeOriginal
               = 0x9003
            */

            if(tag===0x9003){

                const type =
                    get16(entry+2);

                const countValue =
                    get32(entry+4);


                let dataOffset;


                if(type===2){

                    if(countValue<=4){

                        dataOffset =
                            entry+8;

                    }
                    else{

                        dataOffset =
                            tiff+
                            get32(entry+8);

                    }


                    let text="";


                    for(
                        let j=0;
                        j<countValue;
                        j++
                    ){

                        text +=
                            String.fromCharCode(
                                view.getUint8(
                                    dataOffset+j
                                )
                            );

                    }


                    text =
                        text.trim()
                        .replace(
                            /^(\d{4}):(\d{2}):(\d{2})/,
                            "$1-$2-$3"
                        );


                    const date =
                        new Date(
                            text.replace(
                                " ",
                                "T"
                            )
                        );


                    if(
                        !isNaN(
                            date.getTime()
                        )
                    ){

                        return {

                            date:date,

                            source:
                                "Photo metadata"

                        };

                    }

                }

            }

        }

    }
    catch(error){

        console.log(
            "EXIF parsing failed",
            error
        );

    }


    return {

        date:null,

        source:
            "Unavailable"

    };

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date){

    if(!date)
        return "Date unavailable";


    return new Intl.DateTimeFormat(
        undefined,
        {
            year:"numeric",
            month:"long",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    ).format(date);

}


/* =========================================================
   UI ELEMENTS
========================================================= */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const addButton =
    document.getElementById(
        "addButton"
    );

const dropArea =
    document.getElementById(
        "dropArea"
    );

const gallery =
    document.getElementById(
        "gallery"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const photoCount =
    document.getElementById(
        "photoCount"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalImage =
    document.getElementById(
        "modalImage"
    );

const modalDate =
    document.getElementById(
        "modalDate"
    );

const modalName =
    document.getElementById(
        "modalName"
    );

const closeModal =
    document.getElementById(
        "closeModal"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   ADD PHOTOS BUTTON
========================================================= */

addButton.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


/* =========================================================
   FILE INPUT
========================================================= */

fileInput.addEventListener(
    "change",
    async event => {

        await handleFiles(
            event.target.files
        );

        /*
           Allows selecting the
           same photo again later.
        */

        fileInput.value="";

    }
);


/* =========================================================
   DRAG AND DROP
========================================================= */

[
    "dragenter",
    "dragover"
].forEach(
    eventName => {

        dropArea.addEventListener(
            eventName,
            event => {

                event.preventDefault();

                dropArea.classList.add(
                    "dragging"
                );

            }
        );

    }
);


[
    "dragleave",
    "drop"
].forEach(
    eventName => {

        dropArea.addEventListener(
            eventName,
            event => {

                event.preventDefault();

                dropArea.classList.remove(
                    "dragging"
                );

            }
        );

    }
);


dropArea.addEventListener(
    "drop",
    async event => {

        await handleFiles(
            event.dataTransfer.files
        );

    }
);


/* =========================================================
   HANDLE FILES
========================================================= */

async function handleFiles(files){

    const images =
        Array.from(files)
        .filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if(images.length===0){

        showToast(
            "No image files found."
        );

        return;

    }


    showToast(
        `Adding ${images.length} photo${
            images.length===1 ? "" : "s"
        }...`
    );


    for(
        const file of images
    ){

        try {

            const info =
                await getPhotoDate(
                    file
                );


            const photo = {

                name:
                    file.name,

                type:
                    file.type,

                blob:
                    file,

                taken:
                    info.date
                    ? info.date.getTime()
                    : null,

                dateSource:
                    info.source,

                added:
                    Date.now()

            };


            await savePhoto(
                photo
            );

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    await renderGallery();


    showToast(
        `${images.length} photo${
            images.length===1 ? "" : "s"
        } added`
    );

}


/* =========================================================
   RENDER GALLERY
========================================================= */

async function renderGallery(){

    const photos =
        await getAllPhotos();


    gallery.innerHTML="";


    photoCount.textContent =
        `${photos.length} photo${
            photos.length===1
            ? ""
            : "s"
        }`;


    if(photos.length===0){

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";


    /*
       Newest at top.

       Older photos remain farther
       down the page.
    */

    for(
        const photo of photos
    ){

        createPhotoCard(
            photo
        );

    }

}


/* =========================================================
   CREATE PHOTO CARD
========================================================= */

function createPhotoCard(photo){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "photoCard";


    const image =
        document.createElement(
            "img"
        );

    image.loading =
        "lazy";

    image.alt =
        photo.name;


    /*
       Object URL lets the browser
       display the IndexedDB blob.
    */

    const url =
        URL.createObjectURL(
            photo.blob
        );

    image.src =
        url;


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "photoInfo";


    const date =
        document.createElement(
            "div"
        );

    date.className =
        "photoDate";


    const takenDate =
        photo.taken
        ? new Date(photo.taken)
        : null;


    date.textContent =
        formatDate(
            takenDate
        );


    const source =
        document.createElement(
            "div"
        );

    source.className =
        "photoMeta";


    source.textContent =
        photo.dateSource ===
        "Photo metadata"
        ? "Date from photo"
        : photo.dateSource;


    info.appendChild(
        date
    );

    info.appendChild(
        source
    );


    /*
       Delete button
    */

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "deletePhoto";

    deleteButton.innerHTML =
        "×";

    deleteButton.title =
        "Delete photo";


    deleteButton.addEventListener(
        "click",
        async event => {

            event.stopPropagation();


            const confirmed =
                confirm(
                    "Remove this photo from your Memory Wall?"
                );


            if(!confirmed)
                return;


            await deletePhoto(
                photo.id
            );


            URL.revokeObjectURL(
                url
            );


            await renderGallery();

        }
    );


    card.appendChild(
        image
    );

    card.appendChild(
        info
    );

    card.appendChild(
        deleteButton
    );


    /*
       Desktop hover works automatically
       through CSS.

       Clicking/tapping opens the
       larger photo view.
    */

    card.addEventListener(
        "click",
        () => {

            openModal(
                photo,
                url
            );

        }
    );


    gallery.appendChild(
        card
    );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
    photo,
    url
){

    modalImage.src =
        url;

    modalImage.alt =
        photo.name;


    const date =
        photo.taken
        ? new Date(photo.taken)
        : null;


    modalDate.textContent =
        formatDate(
            date
        );


    modalName.textContent =
        `${photo.name} • ${photo.dateSource}`;


    modal.classList.add(
        "open"
    );

}


function closePhotoModal(){

    modal.classList.remove(
        "open"
    );

    modalImage.src =
        "";

}


closeModal.addEventListener(
    "click",
    closePhotoModal
);


modal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            modal
        ){

            closePhotoModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closePhotoModal();

        }

    }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   START
========================================================= */

async function start(){

    try {

        await openDatabase();

        await renderGallery();

    }
    catch(error){

        console.error(
            error
        );

        showToast(
            "Your browser could not open photo storage."
        );

    }

}

start();

</script>

      <script>
  // =========================
  // MEMORY WALL ACCOUNT SYSTEM
  // =========================

  const accountBox = document.createElement("div");

  accountBox.innerHTML = `
    <div style="
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
      width: 280px;
      font-family: Arial, sans-serif;
    ">
      <h2 style="margin-top:0;">Memory Wall</h2>

      <input
        id="accountEmail"
        type="email"
        placeholder="Email"
        style="width:100%; padding:10px; margin-bottom:8px; box-sizing:border-box;"
      >

      <input
        id="accountPassword"
        type="password"
        placeholder="Password"
        style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;"
      >

      <button
        id="signUpButton"
        style="width:100%; padding:10px; margin-bottom:6px;"
      >
        Create account
      </button>

      <button
        id="signInButton"
        style="width:100%; padding:10px;"
      >
        Sign in
      </button>

      <p id="accountMessage" style="font-size:14px;"></p>
    </div>
  `;

  document.body.appendChild(accountBox);


  // CREATE ACCOUNT
  document.getElementById("signUpButton").onclick = async () => {

    const email = document.getElementById("accountEmail").value;
    const password = document.getElementById("accountPassword").value;
    const message = document.getElementById("accountMessage");

    if (!email || !password) {
      message.textContent = "Enter an email and password.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      console.error(error);
      message.textContent = error.message;
      return;
    }

    message.textContent =
      "Account created! Check your email if confirmation is required.";
  };


  // SIGN IN
  document.getElementById("signInButton").onclick = async () => {

    const email = document.getElementById("accountEmail").value;
    const password = document.getElementById("accountPassword").value;
    const message = document.getElementById("accountMessage");

    if (!email || !password) {
      message.textContent = "Enter an email and password.";
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      console.error(error);
      message.textContent = error.message;
      return;
    }

    message.textContent = "Signed in successfully!";
    console.log("Signed-in user:", data.user);
  };
</script>
